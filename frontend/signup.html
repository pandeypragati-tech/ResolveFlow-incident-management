<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ResolveFlow </title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="signup-page">
    <header>
        <nav>
            <a href="index.html">ResolveFlow</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        </nav>
    </header>
    <main>
        <section class="signup-card">
            <h1>Create Your Account</h1>
            <p class="signup-description">
                Join ResolveFlow to manage IT incidents efficiently.
            </p>
            <form action="#" method="post">
                <div class="signup-form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" name="full-name" id="full-name" placeholder="Enter your full name" required>
                </div>
                <div class="signup-form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email" placeholder="Enter your Email" required>
                </div>
                <div class="signup-form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter 10-digitphone number"
                    pattern="[0-9]{10}"  maxlength="10" required>
                </div>
                <div class="signup-form-group">
                    <label for="new-password">Passsword</label>
                    <input type="password" id="new-password" name="password" placeholder="Create a password"
                    minlength="8" required>
                </div>
                <div class="signup-form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                    minlength="8" required>
                </div>
                <div class="signup-terms">
                    <label>
                        <input type="checkbox" name="terms" id="terms" required>
                        I agree to the  terms and conditions.
                    </label>
                </div>
                <button type="submit">Create Account</button>
            </form>
            <p class="signup-login">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
            <a class="signup-home" href="index.html">
                &larr;Back to Home
            </section>  
    </main>

    <footer>
        <p> &copy; 2026 ResolveFlow. All rights reserved.</p>
    </footer>
    
</body>
</html>
