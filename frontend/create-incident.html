
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Incident | ResolveFlow</title>
     <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="create-incident-page">

    <header>
        <nav>
            <a href="index.html">ResolveFlow</a>

            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="incidents.html">Incidents</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>

            <div>
                <a href="login.html">Logout</a>
            </div>
        </nav>
    </header>

    <main class="create-incident-main">

        <section class="incident-form-card">
            <div class="incident-form-heading">
                <a href="dashboard.html" class="incident-back-link">
                    &larr; Back to Dashboard
                </a>

                <h1>Create New Incident</h1>
                <p>Provide the details of your IT issue below.</p>
            </div>

            <form action="#" method="post">

                <div class="incident-form-group">
                    <label for="incident-title">Incident Title</label>
                    <input
                        type="text"
                        id="incident-title"
                        name="title"
                        placeholder="e.g. Email service is not working"
                        required
                    >
                </div>

                <div class="incident-form-group">
                    <label for="incident-category">Category</label>
                    <select id="incident-category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="network">Network</option>
                        <option value="email">Email</option>
                        <option value="access">Access/Login</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="incident-form-row">
                    <div class="incident-form-group">
                        <label for="incident-priority">Priority</label>
                        <select id="incident-priority" name="priority" required>
                            <option value="">Select priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>

                    <div class="incident-form-group">
                        <label for="incident-department">Department</label>
                        <select id="incident-department" name="department" required>
                            <option value="">Select department</option>
                            <option value="it">IT</option>
                            <option value="hr">Human Resources</option>
                            <option value="finance">Finance</option>
                            <option value="sales">Sales</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="incident-form-group">
                    <label for="incident-description">Incident Description</label>
                    <textarea
                        id="incident-description"
                        name="description"
                        rows="5"
                        placeholder="Describe the issue and when it started..."
                        required
                    ></textarea>
                </div>

                <div class="incident-form-group">
                    <label for="incident-attachment">Attachment (Optional)</label>
                    <input
                        type="file"
                        id="incident-attachment"
                        name="attachment"
                    >
                    <small>Attach a screenshot or relevant file if needed.</small>
                </div>

                <div class="incident-form-actions">
                    <a href="dashboard.html" class="incident-cancel-btn">
                        Cancel
                    </a>
                    <button type="submit">Submit Incident</button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ResolveFlow. All rights reserved.</p>
    </footer>

</body>
</html>
